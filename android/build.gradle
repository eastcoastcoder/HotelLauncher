buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// RN 0.83 codegen rejects WebView's navigationType union. Patch before codegen.
gradle.projectsEvaluated {
    def webview = rootProject.subprojects.find { it.name == "react-native-webview" }
    if (webview != null) {
        def patch = webview.tasks.register("patchWebViewSpec") {
            doLast {
                exec {
                    workingDir rootProject.projectDir.parentFile
                    commandLine "node", "scripts/patch-react-native-webview.js"
                }
            }
        }
        webview.tasks.configureEach { task ->
            if (task.name.toLowerCase().contains("codegen") && task.name != "patchWebViewSpec") {
                task.dependsOn(patch)
            }
        }
    }
}
